projects:
  - title: "NetWatch"
    description: "A five-page Streamlit analyst dashboard that correlates PCAP and PCAPNG traffic, up to 100,000 packets, with Windows security events from four log channels and produces evidence-linked alerts for investigation and audit review. Three tunable detection rules flag five failed logons in 300 seconds, 15 ports in 60 seconds, and traffic spikes at three times baseline, mapped to MITRE ATT&CK T1110.001 and T1046. Detections were checked against 800 packets, 80 events, 8 failed logons, and a Wireshark capture."
    tags: ["python", "scapy", "sqlite", "pandas", "streamlit", "mitre att&ck"]
    links:
      - { label: "github", url: "https://github.com/Law-wright/NetWatch" }

  - title: "Secure Employee Management System"
    description: "A Spring Boot application that enforces least privilege for three roles, Admin, Manager, and Employee, with method-level authorization, salted BCrypt hashing, and generic login errors so account names cannot be enumerated. The leave workflow blocks self-approval and re-deciding a request, and authentication, access-denial, and data-change events are logged without passwords or session IDs. Twenty-five JUnit 5 tests pass with zero failures, covering authentication, role checks, workflow rules, and audit logging, aligned to NIST 800-53 AC, IA, and AU controls."
    tags: ["java", "spring boot", "spring security", "sqlite", "junit 5", "nist 800-53"]
    links:
      - { label: "github", url: "https://github.com/Law-wright/Secure-Employee-Management-System-SEMS-" }

  - title: "Software Supply Chain Security Research"
    description: "Compared Log4Shell (CVE-2021-44228, CVSS 10.0) with the 2020 SolarWinds compromise: a flaw embedded in a widely used library against a build-pipeline compromise, to judge third-party dependency and software integrity risk. Also reviewed AI-related security risks across connected systems and presented the method, findings, and risk implications in writing and in talks at Tennessee State University."
    tags: ["vulnerability analysis", "log4shell", "solarwinds", "ai security"]
    links: []   # no link in the index; add a paper or slides link if you have one

