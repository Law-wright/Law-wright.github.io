  bio: "My approach to security started with a Computer Science foundation: I build systems first, so I know where they break. I **built NetWatch to turn packet captures and Windows security events into evidence-linked alerts, and a Spring Security system enforcing least privilege, separation of duties, and audit logging**. With client application work and hands-on Cisco networking behind me, I'm earning my M.S. in Cybersecurity and Networking at Tennessee State University and holding Security+ along the way."
