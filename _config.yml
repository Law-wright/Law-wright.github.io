  bio: "My approach to security started with a Computer Science foundation: I build systems first, so I know where they break. **Secure Employee Management System enforces least privilege, account lockout, and separation of duties, with a STRIDE model and testing that cut dependency CVEs from 61 to 34. NetWatch turns packet captures and Windows security events into evidence-linked alerts.** With client application work and hands-on Cisco networking behind me, I'm earning my M.S. in Cybersecurity and Networking at Tennessee State University and holding Security+ along the way."
