projects:
  - title: "Secure Employee Management System"
    description: "A Spring Boot application that enforces least privilege for Admin, Manager, and Employee through URL rules and method-level authorization, with salted BCrypt, generic login errors, CSRF protection, and account lockout after five failures. The leave workflow blocks self-approval, and an admin-only audit log records authentication, denials, and data changes without passwords or session IDs. A STRIDE threat model maps 13 threats to NIST SP 800-53 and records known gaps. Forty-one JUnit 5 tests pass with zero failures. CodeQL and dependency scanning remediated a high-severity regex denial-of-service finding and cut dependency CVEs from 61 to 34."
    tags: ["java", "spring security", "junit 5", "codeql", "owasp", "nist 800-53"]
    links:
      - { label: "github", url: "https://github.com/Law-wright/Secure-Employee-Management-System-SEMS-" }

  - title: "NetWatch"
    description: "A five-page Streamlit analyst dashboard that correlates up to 100,000 packets of PCAP and PCAPNG traffic with Windows events from Security, System, Application, and Sysmon, and produces evidence-linked alerts with triage status. Three tunable rules flag five failed logons in 300 seconds, 15 distinct SYN ports in 60 seconds, and volume at three times baseline, with user-defined watch rules mapped to MITRE ATT&CK T1110.001 and T1046. Fifty-eight pytest tests validated the rules against 800 packets and 80 events, and a STRIDE model documents the detection gaps."
    tags: ["python", "scapy", "pandas", "streamlit", "pytest", "mitre att&ck"]
    links:
      - { label: "github", url: "https://github.com/Law-wright/NetWatch" }

  - title: "Software Supply Chain Security Research"
    description: "Compared Log4Shell (CVE-2021-44228, CVSS 10.0) with the 2020 SolarWinds compromise: a flaw embedded in a widely used library against a build-pipeline compromise, to judge third-party dependency and software integrity risk. Also reviewed AI-related security risks across connected systems and presented the method, findings, and risk implications in writing and in talks at Tennessee State University."
    tags: ["vulnerability analysis", "log4shell", "solarwinds", "ai security"]
    links: []   # no link in the index; add a paper or slides link if you have one

